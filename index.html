<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B2545">
<title>SKAI Engineering · Smart Rain Roof</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/fonts/local-fonts.css">
<style>
/* =====================================================================
   SKAI world board — fit-to-screen, never scrolls, everything animates.
   Board is the Figma frame at 1959.11 x 1102 (16:9-ish), letterboxed to
   whatever screen it lands on. All motion is CSS transforms on the
   data-role groups inside the SVG.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;                 /* no scrollbars, ever */
  overscroll-behavior: none;
  touch-action: manipulation;
  background: #08080b;
  font-family: Poppins, system-ui, -apple-system, sans-serif;
  color: #e9e9ee;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: grid;
  place-items: center;
  position: fixed;                  /* kills iOS rubber-banding */
  inset: 0;
}

/* ---------------------------------------------------------------- board */

.board {
  --ar: 1.777778;                   /* 1959.11 / 1102 */
  position: relative;
  width:  min(100vw, calc(100vh * var(--ar)));
  height: min(100vh, calc(100vw / var(--ar)));
  overflow: hidden;
  background:
    radial-gradient(125% 95% at 50% -8%,  var(--glow)  0%, transparent 62%),
    radial-gradient(100% 80% at 50% 108%, var(--glow2) 0%, transparent 58%),
    var(--bg);
  box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 30px 90px rgba(0,0,0,.55);
}

/* soft vignette so the themed ground reads as depth, not a flat wash */
.board::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 100% at 50% 50%, transparent 52%, rgba(0,0,0,.42) 100%);
}
@supports (height: 100dvh) {
  .board {
    width:  min(100vw, calc(100dvh * var(--ar)));
    height: min(100dvh, calc(100vw / var(--ar)));
  }
}
.board svg { display: block; width: 100%; height: 100%; }

/* Portrait phones: the board is a landscape game frame, so rotate it into the
   screen instead of leaving a thin letterbox strip. Chrome stays upright. */
@media (orientation: portrait) and (max-width: 820px) {
  .board {
    position: fixed; top: 50%; left: 50%;
    width:  min(100vh, calc(100vw * var(--ar)));
    height: min(100vw, calc(100vh / var(--ar)));
    transform: translate(-50%, -50%) rotate(90deg);
  }
  @supports (height: 100dvh) {
    .board {
      width:  min(100dvh, calc(100vw * var(--ar)));
      height: min(100vw, calc(100dvh / var(--ar)));
    }
  }
}

/* ---- domain mascots: the generated characters, standing on the board ---- */
.board .mascot {
  position: absolute; bottom: 8%; height: 40%;
  opacity: 0; pointer-events: none; z-index: 2;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,.45));
  transition: opacity 200ms ease, transform 260ms cubic-bezier(.55, 0, .85, .12);
}
.board .mascot.robot { right: 17%; transform: translate(110px, 34px) scale(.9); }
.board .mascot.kid   { left: 20%;  transform: translate(-110px, 34px) scale(.9); }
.board .mascot.on {
  opacity: 1; transform: none;
  transition: opacity 200ms ease, transform 440ms cubic-bezier(.16, 1.24, .32, 1);
}
.board .mascot.robot.on { animation: bob 2.6s ease-in-out 500ms infinite; }
.board .mascot.kid.on   { animation: bob 3.1s ease-in-out 900ms infinite; }
@media (prefers-reduced-motion: reduce) { .board .mascot.on { animation: none; } }

/* the activity area — your game renders here, under the chrome */
.stage-slot {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  pointer-events: none;
}

/* ------------------------------------------------------- motion system */
/* Every element is parked off-board in the direction it flies in from.
   Translations are in SVG user units, so they behave identically at any
   screen size. Turning the role off replays the same path in reverse. */

.board [data-role] {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  opacity: 0;
  will-change: transform, opacity;
  transition:
    transform 260ms cubic-bezier(.55, 0, .85, .12),
    opacity   150ms ease-in;
  transition-delay: calc(var(--i, 0) * 22ms);
}

.board [data-role].on {
  transform: none;
  opacity: 1;
  transition:
    transform 440ms cubic-bezier(.16, 1.24, .32, 1),
    opacity   200ms ease-out;
  transition-delay: calc(var(--i, 0) * 38ms);
}

/* per-role flight paths */
.board [data-role="header"] { transform: translate(-520px, -70px) rotate(-7deg); }
.board [data-role="hud"]    { transform: translate(0, -330px) scale(.86); }
.board [data-role="rail"]   { transform: translate(400px, 40px) rotate(6deg); }
.board [data-role="hint"]   { transform: translate(-420px, 120px) rotate(-14deg); }
.board [data-role="cta"]    { transform: translate(0, 460px) scale(.9); }
.board [data-role="trim"]   { transform: translate(-700px, 0); }
.board [data-role="bubble"] {
  transform: translate(-40px, 90px) scale(.25) rotate(-8deg);
  transform-origin: 12% 94%;        /* grows out of the hint button */
}

/* the board itself never flies */
.board [data-role="decor"] { opacity: 1; transform: none; transition: none; }

/* Figma's flat grey stage tint (Rectangle 129) is replaced by the themed
   .board background above, so it is not drawn */
.board [data-role="backdrop"] { display: none; }

/* idle life once things have landed */
.board [data-role="cta"].on   { animation: bob 2.6s ease-in-out 600ms infinite; }
.board [data-role="hint"].on  { animation: pulse 2.2s ease-in-out 700ms infinite; }
@keyframes bob   { 0%,100% { translate: 0 0;    } 50% { translate: 0 -9px; } }
@keyframes pulse { 0%,100% { scale: 1;          } 50% { scale: 1.055;      } }

@media (prefers-reduced-motion: reduce) {
  .board [data-role] { transition-duration: 1ms !important; transition-delay: 0ms !important; }
  .board [data-role].on { animation: none; }
}

/* --------------------------------------------------------------- chrome */
/* Everything here is fixed-position overlay, so it can never add scroll. */

.hud-bar {
  position: fixed; right: clamp(8px, 1.2vw, 18px); bottom: clamp(8px, 1.8vh, 20px);
  display: flex; align-items: center; gap: clamp(6px, .9vw, 12px);
  padding: clamp(6px, 1vh, 10px) clamp(10px, 1.4vw, 16px);
  background: rgba(18,18,23,.82);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 999px;
  font-size: clamp(10px, 1.5vh, 13px);
  z-index: 10;
  transition: opacity .24s ease, transform .24s ease;
  max-width: calc(100vw - 16px);
  flex-wrap: wrap; justify-content: center;
}
body.idle .hud-bar { opacity: 0; transform: translateY(18px); pointer-events: none; }

.hud-bar button {
  font: inherit; font-weight: 600; color: #e9e9ee;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  padding: .45em .9em; cursor: pointer; white-space: nowrap;
  transition: background .18s ease, color .18s ease;
}
.hud-bar button:hover { background: rgba(255,255,255,.16); }
.hud-bar button.play.on { background: #fff; color: #111; }

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, .55vw, 7px); }
.dots i {
  width: clamp(7px, 1.05vh, 10px); aspect-ratio: 1;
  border-radius: 50%; background: rgba(255,255,255,.24);
  cursor: pointer; transition: background .2s ease, transform .2s ease;
}
.dots i:hover { transform: scale(1.35); }
.dots i.on { background: var(--accent, #fff); transform: scale(1.35); }

.caption {
  position: fixed; right: clamp(8px, 1.2vw, 18px);
  bottom: calc(clamp(8px, 1.8vh, 20px) + clamp(38px, 5.6vh, 52px));
  margin: 0;
  font-size: clamp(10px, 1.5vh, 13px); letter-spacing: .01em;
  color: rgba(255,255,255,.6); text-align: right;
  max-width: min(46vw, 360px);
  z-index: 10; pointer-events: none;
  transition: opacity .24s ease;
}
body.idle .caption { opacity: 0; }

.worlds {
  position: fixed; top: clamp(8px, 1.6vh, 18px); left: 50%;
  transform: translateX(-50%);
  display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, .6vw, 8px);
  z-index: 10; max-width: calc(100vw - 12px);
  transition: opacity .24s ease, transform .24s ease;
}
body.idle .worlds { opacity: 0; transform: translateX(-50%) translateY(-16px); pointer-events: none; }

.worlds a {
  font-size: clamp(9px, 1.35vh, 12px); font-weight: 600;
  color: rgba(255,255,255,.66); text-decoration: none; white-space: nowrap;
  background: rgba(18,18,23,.8); backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.1); border-radius: 999px;
  padding: .42em .9em;
}
.worlds a[aria-current] { background: var(--accent); color: #0b0b0e; border-color: transparent; }
.worlds a .sm { display: none; }
@media (max-width: 620px), (max-height: 420px) {
  .worlds a .lg { display: none; }
  .worlds a .sm { display: inline; }
}



@media (max-width: 900px) {
  .caption  { display: none; }
}
@media (max-width: 620px) {
  .hud-bar .full { display: none; }
  .worlds a { padding: .34em .62em; }
}
@media (max-width: 380px) {
  .hud-bar .play { display: none; }
}
/* very short landscape (phones on their side): shrink the chrome further */
@media (max-height: 420px) {
  .caption { display: none; }
  .hud-bar { bottom: 6px; padding: 4px 8px; }
  .worlds  { top: 5px; }
}

:root { --bg: #0B2545; --glow: rgba(31,111,208,.58); --glow2: rgba(247,148,29,.30); --accent: #F7941D; }
</style>

    var d = document.createElement('i');
    d.title = s.note;
    d.onclick = function () { setPlay(false); apply(i); };
    dotsEl.appendChild(d);
  });

  document.querySelector('.prev').onclick = function () { setPlay(false); prev(); };
  document.querySelector('.next').onclick = function () { setPlay(false); next(); };
  playBtn.onclick = function () { setPlay(!timer); };

  document.querySelector('.full').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function () {});
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { setPlay(false); next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { setPlay(false); prev(); e.preventDefault(); }
    else if (e.key === 'Home') { setPlay(false); apply(0); }
    else if (e.key === 'End')  { setPlay(false); apply(STEPS.length - 1); }
    else if (e.key === 'p')    { setPlay(!timer); }
    else if (e.key === 'f')    { document.querySelector('.full').click(); }
    else if (/^[1-9]$/.test(e.key)) { setPlay(false); apply(+e.key - 1); }
  });

  /* tap the board to advance, swipe to scrub */
  var sx = null, sy = null;
  board.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
  board.addEventListener('pointerup', function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    /* the board is rotated 90deg on portrait phones — swipe with it */
    if (matchMedia('(orientation: portrait) and (max-width: 820px)').matches) {
      var t = dx; dx = dy; dy = -t;
    }
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { setPlay(false); dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { setPlay(false); next(); }
  });

  /* chrome fades away when nothing is happening */
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 2800);
  }
  ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });

  /* ---------------------------------------------------------------- boot */

  document.documentElement.style.setProperty('--bg', WORLD.bg);
  document.documentElement.style.setProperty('--glow', WORLD.glow);
  document.documentElement.style.setProperty('--glow2', WORLD.glow2);
  document.documentElement.style.setProperty('--accent', WORLD.accent);
  svg.removeAttribute('width');
  svg.removeAttribute('height');

  apply(0);
  wake();

  /* intro: assemble the board one layer at a time, up to the full state */
  var full = 0;
  STEPS.forEach(function (s, i) { if (s.on.indexOf('cta') !== -1 && !full) full = i; });
  (function assemble(i) {
    if (i > full) return;
    apply(i);
    setTimeout(function () { assemble(i + 1); }, i === 0 ? 190 : 250);
  })(0);
})();

</script>
<script src="smart-rain-roof-shell.js"></script>
</body>
